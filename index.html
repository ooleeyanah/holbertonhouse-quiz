<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Holberton House Quiz</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Coda:wght@400;800&family=Geo:ital@0;1&display=swap"
        rel="stylesheet">
</head>

<body>
    <main class="box">
        <h1>Which House Are You?</h1>

        <section id="start">
            <p>Find out if you're in Lovelace, Hamilton, Hopper or Webb!</p>
            <button id="start-btn" class="primary">Start quiz</button>
        </section>

        <section id="quiz" hidden>
            <p id="progress"></p>
            <h2 id="question"></h2>
            <div id="choices"></div>
        </section>

        <section id="result" hidden>
            <p>You belong in...</p>
            <div class="ribbon">
                <h2 id="result-name"></h2>
            </div>
            <div class="result-intro">
                <img id="result-image" src="" alt="">
                <p id="result-desc"></p>
            </div>
            <blockquote id="result-quote" hidden></blockquote>
            <ul id="result-breakdown"></ul>
            <button id="restart-btn" class="primary">Retake quiz</button>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
